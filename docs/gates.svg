<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="The gates: ratchet, review-cost, spec and traceability and test on the work; contract and duties on the procedure; the MCP surface; exit codes 0, 1 and 2">
  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="40" y="42" font-size="25" font-weight="700" fill="#1f2328">The gates — whether the work is acceptable</text>
    <text x="40" y="68" font-size="15" fill="#656d76">Each one is a program with an exit code. No model takes part in the decision, so swapping the model cannot change the verdict.</text>

    <text x="40" y="102" font-size="13" font-weight="700" fill="#656d76" letter-spacing="1.2">ON THE WORK ITSELF</text>

    <rect x="40" y="116" width="340" height="112" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="62" y="148" font-size="17" font-weight="600" fill="#9a6700">kuli ratchet</text>
    <text x="62" y="172" font-size="13.5" fill="#656d76">nothing got worse than the</text>
    <text x="62" y="192" font-size="13.5" fill="#656d76">recorded baseline: erosion,</text>
    <text x="62" y="212" font-size="13.5" fill="#656d76">verbosity, duplication, worst unit</text>

    <rect x="410" y="116" width="340" height="112" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="432" y="148" font-size="17" font-weight="600" fill="#9a6700">kuli review-cost</text>
    <text x="432" y="172" font-size="13.5" fill="#656d76">added lines per acceptance</text>
    <text x="432" y="192" font-size="13.5" fill="#656d76">criterion. slop is an asymmetry:</text>
    <text x="432" y="212" font-size="13.5" fill="#656d76">cheap to write, dear to read</text>

    <rect x="780" y="116" width="340" height="112" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
    <text x="802" y="148" font-size="17" font-weight="600" fill="#9a6700">spec · traceability · test</text>
    <text x="802" y="172" font-size="13.5" fill="#656d76">a change with no entry in the</text>
    <text x="802" y="192" font-size="13.5" fill="#656d76">specification, a criterion with no</text>
    <text x="802" y="212" font-size="13.5" fill="#656d76">test, a test claiming nothing real</text>

    <text x="40" y="272" font-size="13" font-weight="700" fill="#656d76" letter-spacing="1.2">ON THE PROCEDURE — WHO MAY SAY YES</text>
    <text x="780" y="272" font-size="13" font-weight="700" fill="#656d76" letter-spacing="1.2">AND WHERE THEY ARE CALLED FROM</text>

    <rect x="40" y="286" width="340" height="112" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
    <text x="62" y="318" font-size="17" font-weight="600" fill="#6639ba">kuli contract</text>
    <text x="62" y="342" font-size="13.5" fill="#656d76">the bar is agreed before the work,</text>
    <text x="62" y="362" font-size="13.5" fill="#656d76">signed by two different actors,</text>
    <text x="62" y="382" font-size="13.5" fill="#656d76">and frozen once work begins</text>

    <rect x="410" y="286" width="340" height="112" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.5"/>
    <text x="432" y="318" font-size="17" font-weight="600" fill="#6639ba">kuli duties</text>
    <text x="432" y="342" font-size="13.5" fill="#656d76">the rules and the work they judge</text>
    <text x="432" y="362" font-size="13.5" fill="#656d76">may not change in one commit,</text>
    <text x="432" y="382" font-size="13.5" fill="#656d76">and a rule change is approved</text>

    <rect x="780" y="286" width="340" height="112" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
    <text x="802" y="318" font-size="17" font-weight="600" fill="#1a7f37">kuli serve</text>
    <text x="802" y="342" font-size="13.5" fill="#656d76">every gate above, also an MCP</text>
    <text x="802" y="362" font-size="13.5" fill="#656d76">tool, so an agent calls them in</text>
    <text x="802" y="382" font-size="13.5" fill="#656d76">its own loop. read-only, always</text>

    <text x="40" y="444" font-size="13" font-weight="700" fill="#656d76" letter-spacing="1.2">THE ANSWER IS ONE OF THREE</text>

    <rect x="40" y="458" width="200" height="44" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="64" y="486" font-size="15" font-weight="700" fill="#1a7f37">0 — passed</text>

    <rect x="260" y="458" width="200" height="44" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="284" y="486" font-size="15" font-weight="700" fill="#cf222e">1 — refused</text>

    <rect x="480" y="458" width="280" height="44" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="504" y="486" font-size="15" font-weight="700" fill="#9a6700">2 — could not judge</text>

    <text x="790" y="478" font-size="13.5" fill="#656d76">Two is not a pass. A gate that cannot answer</text>
    <text x="790" y="498" font-size="13.5" fill="#656d76">a question never reports success for it.</text>

    <text x="40" y="534" font-size="13.5" fill="#656d76">A trip is a refactor obligation, not a rejection: include the refactor that pays for it, or record an exception with a reason that stays visible.</text>

  </g>
</svg>
